[build]
  command = "npm run build"
  publish = "dist"

# Hash routing means the SPA fallback is rarely hit, but it costs nothing and
# makes a stray deep link behave.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, or a deploy can be pinned to
# an old build on an installed device until the cache expires.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Vite fingerprints these filenames, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
